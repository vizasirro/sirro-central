name: Align password UI

on:
  push:
    paths:
      - '.github/workflows/align-password-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align password policy and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('id="newPassword" type="password" minlength="8"','id="newPassword" type="password" minlength="12"')
          s=s.replace('id="confirmPassword" type="password" minlength="8"','id="confirmPassword" type="password" minlength="12"')
          s=s.replace('id="recoveryPassword" type="password" minlength="8"','id="recoveryPassword" type="password" minlength="12"')
          s=s.replace('id="recoveryPasswordConfirm" type="password" minlength="8"','id="recoveryPasswordConfirm" type="password" minlength="12"')
          p.write_text(s)

          a=Path('app-main.js')
          js=a.read_text()
          old="if(p.length<8)return showMsg('#updatePasswordMsg','La contraseña debe tener al menos 8 caracteres.','error');"
          new="if(!(p.length>=12&&/[a-z]/.test(p)&&/[A-Z]/.test(p)&&/[0-9]/.test(p)&&/[^A-Za-z0-9]/.test(p)))return showMsg('#updatePasswordMsg','La contraseña debe tener al menos 12 caracteres e incluir mayúscula, minúscula, número y símbolo.','error');"
          if old not in js:
              raise SystemExit('Recovery password check not found')
          js=js.replace(old,new)
          marker="async function createUser(e){\n  e.preventDefault(); showMsg('#userMsg','Creando usuario…');\n"
          insertion="async function createUser(e){\n  e.preventDefault(); showMsg('#userMsg','Creando usuario…');\n  const newPassword=$('#newPassword').value;\n  if(!(newPassword.length>=12&&/[a-z]/.test(newPassword)&&/[A-Z]/.test(newPassword)&&/[0-9]/.test(newPassword)&&/[^A-Za-z0-9]/.test(newPassword)))return showMsg('#userMsg','La contraseña debe tener al menos 12 caracteres e incluir mayúscula, minúscula, número y símbolo.','error');\n"
          if marker not in js:
              raise SystemExit('createUser marker not found')
          js=js.replace(marker,insertion)
          a.write_text(js)

          sw=Path('sw.js')
          w=sw.read_text()
          w=re.sub(r"const CACHE='sirro-v\d+';","const CACHE='sirro-v038';",w)
          sw.write_text(w)
          PY
      - name: Validate
        run: |
          node --check app-main.js
          grep -q 'minlength="12"' index.html
          grep -q 'sirro-v038' sw.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-main.js sw.js
          git commit -m 'security: align password policy in UI' || exit 0
          git push
