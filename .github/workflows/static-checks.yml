name: SIRRO static checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app-main.js
          node --check sirro-core.js
          node --check followup.js
          node --check pendientes.js
          node --check reportes.js
          node --check admin-pruebas.js
          node --check sw.js
      - name: Protect retired RPCs from new frontend use
        shell: bash
        run: |
          set -e
          if grep -RInE "sb\.rpc\('(crear_referencia|sirro_enviar_respuesta|actualizar_mis_preferencias)'" --include='*.js' --include='*.html' .; then
            echo 'Se detectó uso nuevo de una RPC retirada.'
            exit 1
          fi
      - name: Protect clinical constants
        shell: bash
        run: |
          grep -q "America/Tegucigalpa" sirro-core.js
          grep -q "desdeHoras: 48" sirro-core.js
          grep -q "hastaHoras: 72" sirro-core.js
          grep -q "desdeDias: 3" sirro-core.js
          grep -q "hastaDias: 7" sirro-core.js
          grep -q "dia: 40" sirro-core.js
      - name: Require pinned Supabase browser SDK
        shell: bash
        run: |
          grep -q '@supabase/supabase-js@2.112.3' index.html
          ! grep -q '@supabase/supabase-js@2"' index.html
      - name: CANDADO SIRRO - prohibit privileged secrets in browser code
        shell: bash
        run: |
          set -e
          if grep -RInE '(service_role|SUPABASE_SERVICE_ROLE|serviceRoleKey|postgres(ql)?://[^[:space:]"'"']+:[^[:space:]"'"']+@)' --include='*.js' --include='*.html' --include='*.json' . --exclude-dir=node_modules --exclude-dir=.git; then
            echo 'CANDADO SIRRO: se detectó un secreto privilegiado o credencial de base de datos en código público.'
            exit 1
          fi
      - name: CANDADO SIRRO - prohibit privileged Auth administration in browser
        shell: bash
        run: |
          set -e
          if grep -RInE '(auth\.admin\.|createClient\([^)]*service_role)' --include='*.js' --include='*.html' . --exclude-dir=node_modules --exclude-dir=.git; then
            echo 'CANDADO SIRRO: operaciones administrativas de Auth no pueden ejecutarse desde el navegador.'
            exit 1
          fi
      - name: CANDADO SIRRO - security contract
        shell: bash
        run: |
          test -f CANDADO-SIRRO.md
