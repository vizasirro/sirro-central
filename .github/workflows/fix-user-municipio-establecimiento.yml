name: Corregir cascada Municipio-Establecimiento

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-user-municipio-establecimiento.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar corrección
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''function fillUserCatalogs(){
            $('#newEcor').innerHTML='<option value="">Seleccione</option>'+ecors.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
            $('#newMunicipio').innerHTML='<option value="">Seleccione</option>'+municipios.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
            $('#newEst').innerHTML='<option value="">Seleccione</option>'+establishments.map(x=>`<option value="${x.id}">${esc(x.nombre)} · RUPS ${esc(x.codigo_rups)}</option>`).join('');
          }
          function userRoleUI(){
            const r=$('#newRole').value;
            const guest=r==='AUDITOR_CONSULTA', scope=$('#newScope').value;
            $('#newScopeWrap').classList.toggle('hidden',!guest);
            $('#newMonitorWrap').classList.toggle('hidden',!guest);
            $('#newEcorWrap').classList.toggle('hidden',!(['ECOR','JEFE_MUNICIPAL'].includes(r)||(guest&&scope==='ECOR')));
            $('#newMunicipioWrap').classList.toggle('hidden',!(r==='JEFE_MUNICIPAL'||(guest&&scope==='MUNICIPIO')));
            $('#newEstWrap').classList.toggle('hidden',!(['USUARIO_US','USUARIO_HOSPITAL'].includes(r)||(guest&&scope==='ESTABLECIMIENTO')));
          }
          '''
          new = '''function fillUserCatalogs(){
            $('#newEcor').innerHTML='<option value="">Seleccione</option>'+ecors.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
            $('#newMunicipio').innerHTML='<option value="">Seleccione municipio</option>'+municipios.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
            fillUserEstablishments();
          }
          function fillUserEstablishments(){
            const municipioId=$('#newMunicipio').value;
            const options=municipioId?establishments.filter(x=>x.municipio_id===municipioId):[];
            $('#newEst').innerHTML='<option value="">'+(municipioId?'Seleccione establecimiento':'Seleccione primero un municipio')+'</option>'+options.map(x=>`<option value="${x.id}">${esc(x.nombre)} · RUPS ${esc(x.codigo_rups)}</option>`).join('');
            $('#newEst').disabled=!municipioId;
          }
          function userRoleUI(){
            const r=$('#newRole').value;
            const guest=r==='AUDITOR_CONSULTA', scope=$('#newScope').value;
            const needsEstablishment=['USUARIO_US','USUARIO_HOSPITAL'].includes(r)||(guest&&scope==='ESTABLECIMIENTO');
            $('#newScopeWrap').classList.toggle('hidden',!guest);
            $('#newMonitorWrap').classList.toggle('hidden',!guest);
            $('#newEcorWrap').classList.toggle('hidden',!(['ECOR','JEFE_MUNICIPAL'].includes(r)||(guest&&scope==='ECOR')));
            $('#newMunicipioWrap').classList.toggle('hidden',!(r==='JEFE_MUNICIPAL'||needsEstablishment||(guest&&scope==='MUNICIPIO')));
            $('#newEstWrap').classList.toggle('hidden',!needsEstablishment);
            if(!needsEstablishment) $('#newEst').value='';
            fillUserEstablishments();
          }
          '''
          if old not in s:
              raise SystemExit('No se encontró el bloque esperado en index.html')
          s = s.replace(old, new, 1)
          old_listener = "$('#userForm').addEventListener('submit',createUser); $('#newRole').addEventListener('change',userRoleUI);\n$('#newScope').addEventListener('change',userRoleUI);"
          new_listener = "$('#userForm').addEventListener('submit',createUser); $('#newRole').addEventListener('change',userRoleUI);\n$('#newScope').addEventListener('change',userRoleUI); $('#newMunicipio').addEventListener('change',fillUserEstablishments);"
          if old_listener not in s:
              raise SystemExit('No se encontró el bloque de eventos esperado')
          s = s.replace(old_listener, new_listener, 1)
          p.write_text(s)
          PY
      - name: Guardar cambio
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "SIRRO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir selección municipio antes de establecimiento"
          git push
