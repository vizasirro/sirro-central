name: Cargar Pendientes directamente

on:
  push:
    paths:
      - '.github/workflows/fix-pendientes-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar módulos directamente en index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="./followup.js"></script>\n</body>'
          new='''<script src="./sirro-core.js"></script>\n<script src="./followup.js"></script>\n<script src="./reportes.js"></script>\n<script src="./pendientes.js"></script>\n<script src="./admin-pruebas.js"></script>\n</body>'''
          if old in s:
              s=s.replace(old,new,1)
          else:
              # Idempotente: si ya existe followup, asegurar los demás antes de </body>.
              required=['./sirro-core.js','./followup.js','./reportes.js','./pendientes.js','./admin-pruebas.js']
              for src in required:
                  tag=f'<script src="{src}"></script>'
                  if tag not in s:
                      s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Dejar Service Worker solo para caché
        run: |
          cat > sw.js <<'EOF'
          const CACHE='sirro-v036';
          const ASSETS=['./','./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png','./logo-region-olancho.png','./viza-logo.svg','./sirro-core.js','./followup.js','./reportes.js','./pendientes.js','./admin-pruebas.js'];

          self.addEventListener('install',e=>{
            self.skipWaiting();
            e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));
          });

          self.addEventListener('activate',e=>{
            e.waitUntil(Promise.all([
              self.clients.claim(),
              caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))
            ]));
          });

          self.addEventListener('fetch',e=>{
            if(e.request.method!=='GET')return;
            const u=new URL(e.request.url);
            const isNavigation=e.request.mode==='navigate'||u.pathname.endsWith('/index.html')||u.pathname==='/';
            if(isNavigation){
              e.respondWith(
                fetch(e.request,{cache:'no-store'})
                  .then(r=>{const clone=r.clone();caches.open(CACHE).then(c=>c.put(e.request,clone));return r;})
                  .catch(()=>caches.match(e.request).then(r=>r||caches.match('./index.html')))
              );
              return;
            }
            e.respondWith(
              fetch(e.request)
                .then(r=>{const clone=r.clone();caches.open(CACHE).then(c=>c.put(e.request,clone));return r;})
                .catch(()=>caches.match(e.request))
            );
          });
          EOF
      - name: Verificar carga directa
        run: |
          grep -q '<script src="./pendientes.js"></script>' index.html
          grep -q '<script src="./reportes.js"></script>' index.html
          grep -q '<script src="./admin-pruebas.js"></script>' index.html
          grep -q "sirro-v036" sw.js
          ! grep -q "html=html.replace" sw.js
      - name: Guardar corrección
        run: |
          git config user.name 'SIRRO Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Cargar Pendientes directamente desde Inicio'
            git push
          fi
